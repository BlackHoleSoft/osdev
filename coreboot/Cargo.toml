[package]
name = "coreboot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies for OS development
bootloader = "0.9"
x86_64 = "0.14"
uart_16550 = "0.2"
pic8259 = "0.10"
pc-keyboard = "0.5"

# For no_std environment
rlibc = "1.0"
spin = "0.5"
volatile = "0.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
